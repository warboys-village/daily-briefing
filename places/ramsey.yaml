# Ramsey Place Configuration
placeName: "Ramsey"
villageName: "Ramsey"
county: "Cambridgeshire"
districtCouncil: "Huntingdonshire District Council"
parishCouncil: "Ramsey Town Council"

siteTitle: "Ramsey Daily Briefing"
siteUrl: "https://daily.ramsey.town"
siteDescription: "Daily aggregated local news, town council minutes, and planning applications for Ramsey, Cambridgeshire."
timezone: "Europe/London"
outputDir: "src/briefings/ramsey"
dataDir: "src/_data/ramsey"

theme:
  primary: "#4e3c8a"
  primaryHover: "#382b63"
  accent: "#4e3c8a"
  tagBg: "#f3f0f9"
  archiveBg: "#f3f0f9"
  archiveBorder: "#dcd3ed"
  archiveText: "#382b63"
  dark:
    primary: "#a899db"
    primaryHover: "#c4b8e8"
    accent: "#a899db"
    tagBg: "#221a3b"
    archiveBg: "#221a3b"
    archiveBorder: "#4e3c8a"
    archiveText: "#e6e1f5"

llmConfig:
  model: "gemini-2.5-flash"
  defaultModelFamily: "flash"
  maxTurns: 2
  maxTokens: 1500
  preFilterDays: 30
  maxItemSnippetLength: 800
  maxTotalItems: 80

schools:
  - config: "schools/abbey.yaml"
    slug: "abbey"
  - config: "schools/spinning.yaml"
    slug: "spinning"
  - config: "schools/ramsey-juniors.yaml"
    slug: "ramsey-juniors"
  - config: "schools/ashbeach.yaml"
    slug: "ashbeach"

sources:
  - id: "google-news"
    type: "rss"
    name: "Google News (Ramsey)"
    url: "https://news.google.com/rss/search?q=Ramsey+Cambridgeshire&hl=en-GB&gl=GB&ceid=GB:en"
    enabled: true
    params:
      placeFilter: "Ramsey"
      defaultTtlDays: 21

  - id: "hunts-post"
    type: "rss"
    name: "The Hunts Post News"
    url: "https://www.huntspost.co.uk/news/rss"
    filterKeyword: "Ramsey"
    enabled: true
    params:
      filterKeyword: "Ramsey"
      placeFilter: "Ramsey"
      defaultTtlDays: 21

  - id: "hdc-planning"
    type: "hdc-planning"
    name: "Huntingdonshire District Council Planning"
    parishFilter: "Ramsey"
    url: "https://publicaccess.huntingdonshire.gov.uk/online-applications/"
    enabled: true
    params:
      parishFilter: "Ramsey"
      defaultTtlDays: 90

  - id: "ramsey-town"
    type: "town-council"
    name: "Ramsey Town Council"
    url: "https://www.ramseytowncouncil.gov.uk/documents"
    enabled: true
    params:
      parishName: "Ramsey Town Council"
      defaultTtlDays: 60

  - id: "ramsey-newsletter"
    type: "ramsey-council-newsletter"
    name: "Ramsey Council Newsletter"
    url: "https://www.ramseytowncouncil.gov.uk/town-council-newsletters"
    enabled: true
    params:
      placeFilter: "Ramsey"
      defaultTtlDays: 30

  - id: "library-events"
    type: "library-events"
    name: "Library Events Calendar"
    url: "https://info.cambridgeshire.gov.uk/kb5/cambridgeshire/directory/results.action?camcommunitychannel=6-4&location_postcode__outcode=PE26&sortorder=1&sorttype=field&sortfield=__created"
    enabled: true
    params:
      outcode: "PE26"
      placeFilter: "Ramsey"

  - id: "cambs-county"
    type: "county-council"
    name: "Cambridgeshire County Council"
    url: "https://cambridgeshire.cmis.uk.com/ccc_live/"
    enabled: true
    params:
      placeFilter: "Ramsey"
      defaultTtlDays: 60

  - id: "abbey-college"
    type: "abbey-college"
    name: "Abbey College Weekly Updates"
    url: "https://www.abbey.college/weekly-updates"
    enabled: true
    params:
      schoolSlug: "abbey"
      placeFilter: "Ramsey"
      defaultRelevance: "school"

  - id: "spinning-school"
    type: "school-ics"
    name: "Ramsey Spinning Infant School Calendar & Newsletters"
    url: "https://infants.ramspin.org/community/newsletters"
    icsUrl: "https://calendar.google.com/calendar/ical/c_ec35b3b17b5c07a34ba07eaa6acd60e873a4b5247765be7a8a4fe539a60295b9%40group.calendar.google.com/public/basic.ics"
    enabled: true
    params:
      schoolSlug: "spinning"
      schoolName: "Ramsey Spinning Infant School"
      icsUrl: "https://calendar.google.com/calendar/ical/c_ec35b3b17b5c07a34ba07eaa6acd60e873a4b5247765be7a8a4fe539a60295b9%40group.calendar.google.com/public/basic.ics"
      placeName: "Ramsey"
      defaultRelevance: "school"

  - id: "ramsey-juniors-school"
    type: "school-ics"
    name: "Ramsey Junior School Calendar & Newsletters"
    url: "https://juniors.ramspin.org/community/newsletters"
    icsUrl: "https://calendar.google.com/calendar/ical/c_9dbb5827ff71f7131e07c3b6e78efbc765e337f97b4f58edf52f15b79ef4ac89%40group.calendar.google.com/public/basic.ics"
    enabled: true
    params:
      schoolSlug: "ramsey-juniors"
      schoolName: "Ramsey Junior School"
      icsUrl: "https://calendar.google.com/calendar/ical/c_9dbb5827ff71f7131e07c3b6e78efbc765e337f97b4f58edf52f15b79ef4ac89%40group.calendar.google.com/public/basic.ics"
      placeName: "Ramsey"
      defaultRelevance: "school"

  - id: "ashbeach-school"
    type: "ashbeach-school"
    name: "The Ashbeach Primary School"
    url: "https://www.ashbeachprimary.co.uk/"
    enabled: true
    params:
      schoolSlug: "ashbeach"
      schoolName: "The Ashbeach Primary School"
      placeName: "Ramsey"
      defaultRelevance: "school"
